*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);

  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(rep)tx.repeat.set(rep[0],rep[1]);return tx;
}

    g.fillStyle='#7A3118';g.fillRect(x,0,7,h);

    g.fillStyle='#BE6339';g.fillRect(x+26,0,10,h);}

    g.fillStyle='#5E2412';g.fillRect(0,y-7,w,7);
    g.fillStyle='#C26A40';g.fillRect(0,y-11,w,3);}
});

/* roof */
function faces(list,m,grp){
  const pos=[],uv=[];
  list.forEach(f=>{
    const p=f.map(a=>V(a[0],a[1],a[2]));
    const e=p[1].clone().sub(p[0]).normalize();
    const c=new THREE.Vector3();p.slice(2).forEach(q=>c.add(q));c.divideScalar(p.length-2);
    const s=c.sub(p[0]);s.sub(e.clone().multiplyScalar(s.dot(e))).normalize();
    (p.length===4?[[0,1,2],[0,2,3]]:[[0,1,2]]).forEach(tri=>tri.forEach(i=>{pos.push(p[i].x,p[i].y,p[i].z);uv.push(p[i].dot(e)/4,p[i].dot(s)/3.6);}));
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  const me=new THREE.Mesh(g,m);me.castShadow=true;me.receiveShadow=true;(grp||roof).add(me);return me;
}
function beam(a,b,w,h,m){
  const p=V(a[0],a[1],a[2]),q=V(b[0],b[1],b[2]);
  const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,p.distanceTo(q)),m);
  me.position.copy(p).add(q).multiplyScalar(0.5);me.lookAt(q);me.castShadow=true;roof.add(me);return me;
}
const tan30=Math.tan(Math.PI/6);
(function hip(){
  const [x1,x2,y1,y2]=MODEL.roof.hip,eh=MODEL.roof.eave,w=(y2-y1)/2,rh=eh+w*tan30,yc=(y1+y2)/2,r1=x1+w,r2=x2-w;
  const A=[x1,y1,eh],B=[x2,y1,eh],C=[x2,y2,eh],D=[x1,y2,eh],R1=[r1,yc,rh],R2=[r2,yc,rh];
  faces([[A,B,R2,R1],[C,D,R1,R2],[B,C,R2],[D,A,R1]],mat.tile);
  [[A,B],[B,C],[C,D],[D,A]].forEach(([a,b])=>beam([a[0],a[1],a[2]-0.25],[b[0],b[1],b[2]-0.25],0.25,0.6,mat.teak));
  [[R1,R2],[A,R1],[D,R1],[B,R2],[C,R2]].forEach(([a,b])=>beam([a[0],a[1],a[2]+0.12],[b[0],b[1],b[2]+0.12],0.5,0.32,mat.ridge));
})();

/* trees */
function shade(x,y,r,h){
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.45,h,10),mat.trunk);tr.position.set(X(x),h/2,Z(y));tr.castShadow=true;site.add(tr);

}
function palm(x,y,h,lean){
  const g=new THREE.Group();g.position.set(X(x),0,Z(y));
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.38,h,10),mat.palm);tr.position.y=h/2;tr.castShadow=true;g.add(tr);
  for(let i=0;i<9;i++){
    const f=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.08,6),mat.leaf2);
    const a=i/9*Math.PI*2;f.position.set(Math.sin(a)*2.6,h-0.6,Math.cos(a)*2.6);f.rotation.y=a;f.rotation.x=0.45;f.castShadow=true;g.add(f);
  }
  g.rotation.z=lean;site.add(g);
}

/* labels */
function makeLabel(text,x,y,h,grp,size){
  const fs=44,c=document.createElement('canvas'),g=c.getContext('2d');
  const font='500 '+fs+'px Commissioner, system-ui, sans-serif';g.font=font;
  const w=Math.ceil(g.measureText(text).width)+28;c.width=w;c.height=72;
  g.font=font;g.textBaseline='middle';g.textAlign='center';
  g.lineWidth=7;g.strokeStyle='rgba(30,18,10,0.75)';g.strokeText(text,w/2,37);
  g.fillStyle='#FFF7EA';g.fillText(text,w/2,37);
  const tx=new THREE.CanvasTexture(c);tx.encoding=THREE.sRGBEncoding;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,transparent:true}));
  const k=size||1.35;sp.scale.set(k*w/72,k,1);sp.position.set(X(x),h,Z(y));sp.renderOrder=10;grp.add(sp);
}
function buildLabels(){
  MODEL.rooms.forEach(([n,x,y])=>makeLabel(n,x,y,F+4,labels));
  makeLabel('East road',85,17.5,1,always,2.2);

}

/* views */
const views={
  hero:{dir:[1,0.75,0.95],t:[0,6,-1],w:68,h:44},
  front:{dir:[1,0.12,0.1],t:[0,8,0],w:62,h:40},
  north:{dir:[0.12,0.32,-1],t:[0,7,0],w:73,h:30},
  top:{dir:[0.06,1,0],t:[2.5,0,-3.5],w:42,h:90}
};
function viewPose(name){
  const v=views[name],asp=camera.aspect,k=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const d=Math.max(v.h/k,v.w/(k*asp));
  const target=new THREE.Vector3(...v.t);
  return{pos:target.clone().add(new THREE.Vector3(...v.dir).normalize().multiplyScalar(d)),target};
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let anim=null;
function goTo(name,instant){
  const p=viewPose(name);
  document.querySelectorAll('nav [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));
  if(instant||reduce){camera.position.copy(p.pos);controls.target.copy(p.target);controls.update();return;}
  anim={t0:performance.now(),dur:750,p0:camera.position.clone(),t0v:controls.target.clone(),p1:p.pos,t1:p.target};
}
document.querySelectorAll('nav [data-view]').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.view)));
const roofBtn=document.getElementById('roofBtn');
roofBtn.addEventListener('click',()=>{
  roof.visible=!roof.visible;labels.visible=!roof.visible;
  roofBtn.setAttribute('aria-pressed',String(!roof.visible));
  roofBtn.textContent=roof.visible?'Lift roof':'Put roof back';
});
controls.addEventListener('start',()=>{anim=null;document.querySelectorAll('nav [data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));});

function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);resize();
goTo('hero',true);

function loop(now){
  if(anim){
    let k=Math.min(1,(now-anim.t0)/anim.dur);k=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0v,anim.t1,k);
    if(k>=1)anim=null;
  }
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
